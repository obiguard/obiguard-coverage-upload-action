name: Test action

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy lcov report
        run: |
          mkdir -p coverage
          cat > coverage/lcov.info <<'EOF'
          SF:src/example.js
          DA:1,1
          DA:2,0
          end_of_record
          EOF

      - name: Start fake gateway
        run: |
          nohup python3 test/fake_server.py 8123 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8123/ && break
            sleep 0.25
          done

      - name: Upload to the fake gateway (should succeed)
        uses: ./
        with:
          lcov-path: coverage/lcov.info
          gateway-url: http://127.0.0.1:8123/v1/coverage
          fail-on-error: 'true'
        env:
          OBIGUARD_COVERAGE_TOKEN: test-token

      - name: Create an lcov report bigger than Linux's single-argument limit
        run: |
          # Regression test for the payload being passed to curl as a literal
          # `-d` argument: Linux caps a single execve() argument at ~128KB
          # (MAX_ARG_STRLEN), separate from the larger overall ARG_MAX. A real
          # project's lcov report — one entry per line/branch/function —
          # blows past that easily, and the failure (curl exit 126) looks like
          # an unreachable/misconfigured destination rather than an oversized
          # argument, so this needs its own coverage.
          {
            for i in $(seq 1 20000); do
              echo "SF:src/example_$i.js"
              echo "DA:1,1"
              echo "DA:2,0"
              echo "end_of_record"
            done
          } > coverage/large-lcov.info
          wc -c coverage/large-lcov.info

      - name: Upload a large lcov report (should succeed, not exit 126)
        uses: ./
        with:
          lcov-path: coverage/large-lcov.info
          gateway-url: http://127.0.0.1:8123/v1/coverage
          fail-on-error: 'true'
        env:
          OBIGUARD_COVERAGE_TOKEN: test-token

      - name: Upload with one unreachable destination (should warn, not fail)
        uses: ./
        with:
          lcov-path: coverage/lcov.info
          destinations: |
            http://127.0.0.1:8123/v1/coverage=test-token
            http://127.0.0.1:1/v1/coverage=test-token
          connect-timeout: '2'
          max-time: '3'

      - name: Same, but fail-on-error (should fail the step)
        id: expect_failure
        continue-on-error: true
        uses: ./
        with:
          lcov-path: coverage/lcov.info
          destinations: |
            http://127.0.0.1:1/v1/coverage=test-token
          fail-on-error: 'true'
          connect-timeout: '2'
          max-time: '3'

      - name: Assert the fail-on-error step actually failed
        run: |
          if [ "${{ steps.expect_failure.outcome }}" != "failure" ]; then
            echo "::error::expected the fail-on-error step to fail, but it reported '${{ steps.expect_failure.outcome }}'"
            exit 1
          fi
          echo "fail-on-error behaved correctly"

      - name: Missing lcov-path should fail regardless of fail-on-error
        id: expect_missing_file_failure
        continue-on-error: true
        uses: ./
        with:
          lcov-path: coverage/does-not-exist.info
          gateway-url: http://127.0.0.1:8123/v1/coverage
        env:
          OBIGUARD_COVERAGE_TOKEN: test-token

      - name: Assert missing-file step failed
        run: |
          if [ "${{ steps.expect_missing_file_failure.outcome }}" != "failure" ]; then
            echo "::error::expected the missing-lcov-path step to fail, but it reported '${{ steps.expect_missing_file_failure.outcome }}'"
            exit 1
          fi

      - name: Stop fake gateway
        if: always()
        run: kill "$(cat server.pid)" || true
