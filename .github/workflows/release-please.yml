name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  # Actions are consumed as `uses: obiguard/obiguard-coverage-upload-action@v1`,
  # not a pinned semver — so the floating major tag has to be moved to the new
  # release on every release. This is the pattern release-please-action's own
  # README documents for exactly this case (see "Tagging Major Version").
  update-major-tag:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required here: the default shallow checkout doesn't
      # bring in the release tag the sibling `release-please` job just pushed
      # moments earlier, so `git tag -fa` below can't resolve it as a ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the floating major version tag
        env:
          MAJOR_TAG: v${{ needs.release-please.outputs.major }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR_TAG" "$RELEASE_TAG" -m "Release $MAJOR_TAG ($RELEASE_TAG)"
          git push origin "$MAJOR_TAG" --force
